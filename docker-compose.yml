services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-extrovis}
    volumes:
      - extrovis_mysql_data:/var/lib/mysql
      # Optional first-boot import:
      # - ./extrovis.sql:/docker-entrypoint-initdb.d/01-extrovis.sql:ro
    ports:
      - "${MYSQL_PUBLISH_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      APP_HOST: 0.0.0.0
      APP_PORT: ${APP_PORT:-4000}
      JWT_SECRET: ${JWT_SECRET:-change-me-extrovis-jwt}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@extrovis.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@12345}
      ADMIN_NAME: ${ADMIN_NAME:-Extrovis Admin}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      DB_NAME: ${MYSQL_DATABASE:-extrovis}
      RUN_SEED: ${RUN_SEED:-0}
    ports:
      - "${APP_PUBLISH_PORT:-4000}:4000"
    volumes:
      - extrovis_uploads:/app/server/uploads
      # Persist/override DB config (optional — DB_* env already works):
      # - ./server/config/config.json:/app/server/config/config.json:ro

volumes:
  extrovis_mysql_data:
  extrovis_uploads:
