services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-extrovis}
    volumes:
      - extrovis_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Matches existing UAT container naming on refex host
  extrovis-uat:
    build: .
    container_name: extrovis-uat
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      APP_HOST: 0.0.0.0
      APP_PORT: ${APP_PORT:-3072}
      JWT_SECRET: ${JWT_SECRET:-change-me-extrovis-jwt}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@extrovis.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@12345}
      ADMIN_NAME: ${ADMIN_NAME:-Extrovis Admin}
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-rootpassword}
      DB_NAME: ${DB_NAME:-extrovis}
      RUN_SEED: ${RUN_SEED:-0}
    # CRITICAL: publish to host so nginx/openresty can reach the app
    ports:
      - "${APP_PUBLISH_PORT:-3072}:3072"
    volumes:
      - extrovis_uploads:/app/server/uploads

volumes:
  extrovis_mysql_data:
  extrovis_uploads:
